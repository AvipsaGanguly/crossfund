name: CrossFund CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  contracts-test:
    name: 🦀 Soroban Smart Contracts Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run Soroban Contracts Unit Tests
        run: |
          cd contracts
          cargo test --workspace

  frontend-test-and-build:
    name: ⚡ React Frontend Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install

      - name: Run Vitest Unit & Component Tests
        run: |
          npm test

      - name: Validate Vite Production Bundle
        run: |
          cd frontend
          npx vite build
