[package]
name = "campaign-manager"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "20.5.0"

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
donation-manager = { path = "../donation-manager", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
